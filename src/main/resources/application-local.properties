# 실행 작업 디렉터리 아래의 .config 폴더에서 설정 파일을 불러옵니다.
# 프로젝트 루트에서 실행하면 프로젝트 루트의 .config 폴더를 사용합니다.
# DB 접속 설정과 Gemini, NVIDIA API 설정을 각각의 파일에서 읽습니다.
spring.config.import=file:./.config/db.properties,\
                     file:./.config/gemini.properties,\
                     file:./.config/nvidia.properties
