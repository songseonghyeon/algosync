name: Deploy Algorithm Review Bot Backend

on:
  push:
    branches: ["main", "feat/cicd"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 자바 환경 세팅 및 빌드
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build Backend with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      # 2. 도커 허브 로그인 및 이미지 푸시
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/algosync:latest

      # 3. AWS EC2 서버 원격 접속 후 도커 컴포즈로 새 이미지 가동
      - name: Execute Server Command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_KEY }}
          port: ${{ secrets.AWS_EC2_PORT }}
          script: |
            cd /home/ubuntu/AlgoSync
            
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -f