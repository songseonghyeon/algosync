version: '3.8'

services:
  # 로컬에서 백엔드가 접속할 PostgreSQL을 실행합니다.
  algosync-db:
    image: postgres:15-alpine
    container_name: algosync-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: algosync
      POSTGRES_PASSWORD: dkfrhflwma!
      POSTGRES_DB: algosync
      # 마운트 루트에 남아 있는 파일과 분리된 하위 폴더에 DB를 초기화합니다.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 내 컴퓨터 프로젝트 폴더 안에 db-data라는 이름으로 실제 DB 데이터가 저장됩니다.
      - ./db-data:/var/lib/postgresql/data
    restart: always
