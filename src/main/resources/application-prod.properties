# 운영 Docker 이미지에서 prod 프로필을 활성화하면 이 설정을 사용합니다.
# 컨테이너 내부의 절대 경로인 /app/.config에서 설정 파일을 불러옵니다.
# DB 접속 설정과 Gemini, NVIDIA API 설정을 각각의 파일에서 읽습니다.
spring.config.import=file:/app/.config/db.properties,\
                     file:/app/.config/gemini.properties,\
                     file:/app/.config/nvidia.properties
