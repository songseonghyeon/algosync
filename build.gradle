// Java 빌드, Spring Boot 실행 JAR 생성, 의존성 버전 관리를 설정합니다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.algosync'
version = '0.0.1-SNAPSHOT'
description = 'algosync'

java {
    // 컴파일에 사용할 Java 버전을 지정합니다.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 API와 MyBatis를 사용하며 PostgreSQL 드라이버는 실행 시 불러옵니다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    // Gemini와 OpenAI 호환 NVIDIA API 호출에 LangChain4j를 사용합니다.
    implementation 'dev.langchain4j:langchain4j:1.17.2'
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini:1.17.2'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.17.2'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    // JUnit Platform으로 테스트를 실행합니다.
    useJUnitPlatform()
}
